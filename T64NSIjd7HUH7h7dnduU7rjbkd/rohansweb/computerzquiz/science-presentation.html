const slides=()=>[...stage.querySelectorAll(".slide")];function show(n){const all=slides();index=Math.max(0,Math.min(all.length-1,n));all.forEach((s,i)=>s.classList.toggle("active",i===index));document.getElementById("count").textContent=String(index+1).padStart(2,"0")+" / "+String(all.length).padStart(2,"0");document.getElementById("fill").style.width=((index+1)/all.length*100)+"%";document.getElementById("prev").disabled=index===0;document.getElementById("next").disabled=index===all.length-1}document.getElementById("prev").onclick=()=>show(index-1);document.getElementById("next").onclick=()=>show(index+1);document.getElementById("full").onclick=async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch(e){}};document.addEventListener("keydown",e=>{if(["ArrowRight","PageDown"," "].includes(e.key)){e.preventDefault();show(index+1)}if(["ArrowLeft","PageUp"].includes(e.key))show(index-1)});window.addEventListener("message",e=>{if(e.origin!==location.origin||e.data?.type!=="three-seeds-science-go-to-slide")return;show(Number(e.data.index)||0)});window.goToScienceSlide=show;makeSlides();show(0);
