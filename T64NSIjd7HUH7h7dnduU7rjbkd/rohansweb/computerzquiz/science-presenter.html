<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Science Presenter View | Three Seeds</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3eee8;color:#28211d;font-family:Arial,sans-serif}.bar{min-height:64px;background:#242033;color:white;display:flex;align-items:center;justify-content:space-between;padding:12px 20px;gap:12px;flex-wrap:wrap}.bar strong{font-size:13px;letter-spacing:1px}.bar select,.bar button,.btn{border:0;border-radius:10px;padding:11px 14px;font-weight:800;cursor:pointer}.bar select{background:white;color:#28211d}.bar button,.btn{background:#f47721;color:white}.layout{max-width:1500px;margin:auto;padding:18px;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,.8fr);gap:18px}.panel{background:white;border:1px solid #e8e0d9;border-radius:16px;padding:17px;box-shadow:0 6px 20px #3020160a}.label{font-size:11px;letter-spacing:2px;color:#d65c1d;font-weight:900;text-transform:uppercase}.screen{aspect-ratio:16/9;background:#172033;border-radius:11px;overflow:hidden;margin-top:12px}.screen iframe{width:100%;height:100%;border:0}.row{display:flex;gap:9px;flex-wrap:wrap;margin-top:13px}.btn.secondary{background:#eee9e5;color:#302b29}.btn:disabled{opacity:.35;cursor:default}.notes{width:100%;min-height:150px;border:1px solid #e7ddd5;border-radius:10px;padding:12px;font:14px/1.5 Arial;margin-top:10px;resize:vertical}.preview{margin-top:12px;border-radius:12px;padding:22px;background:linear-gradient(120deg,#f47721,#42336f);color:white;min-height:130px}.preview small{letter-spacing:2px}.preview h2{font-size:24px;margin:12px 0 0}.slide-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px;max-height:230px;overflow:auto}.slide-pick{background:white;border:1px solid #e7ddd5;border-radius:8px;padding:9px;text-align:left;font-size:12px;cursor:pointer}.slide-pick.active{border:2px solid #f47721;background:#fff3e9}.timer{font-size:38px;font-weight:900;margin-top:10px}.hint,.status{font-size:12px;line-height:1.5;color:#776c65;margin-top:9px}@media(max-width:850px){.layout{grid-template-columns:1fr;padding:10px}.slide-list{grid-template-columns:repeat(2,minmax(0,1fr))}.bar{padding:12px}.screen{aspect-ratio:4/3}}
</style></head><body><header class="bar"><strong>THREE SEEDS · SCIENCE PRESENTER VIEW</strong><div><select id="topic"><option>Forces &amp; Magnets</option><option>Space</option><option>Plants</option><option>Human Body</option><option>Biology</option><option>Chemistry</option><option>Physics</option><option>Earth Science</option><option>Animals &amp; Habitats</option></select> <button id="launch">Open audience display</button></div></header><main class="layout"><section class="panel"><div class="label">Audience display preview</div><div class="screen"><iframe id="display" title="Audience presentation" allowfullscreen></iframe></div><div class="row"><button class="btn secondary" id="back">Previous</button><button class="btn" id="forward">Next slide</button><button class="btn secondary" id="fullscreen">Fullscreen preview</button></div><div class="label" style="margin-top:20px">Jump to slide</div><div class="slide-list" id="slideList"></div></section><aside><section class="panel"><div class="label">Up next</div><div class="preview"><small id="nextNumber">SLIDE 02</small><h2 id="nextTitle">Loading presentation…</h2></div><div class="label" style="margin-top:18px">Private presenter notes</div><textarea id="notes" class="notes" placeholder="Write your speaking notes for this slide. They are saved on this device and are not shown to the audience."></textarea><div class="hint">Your notes stay in this presenter window and are never sent to the audience display.</div></section><section class="panel" style="margin-top:15px"><div class="label">Presentation timer</div><div class="timer" id="timer">00:00</div><div class="row"><button class="btn" id="startTimer">Start</button><button class="btn secondary" id="resetTimer">Reset</button></div><div class="status" id="status">Loading slide controls…</div></section></aside></main>
<script>
(()=>{const $=id=>document.getElementById(id);let topic="Forces & Magnets",index=0,total=0,titles=[],seconds=0,timer=null,opened=null;const frame=$("display");function path(){return "./science-presentation.html?topic="+encodeURIComponent(topic)}function key(){return "three-seeds-presenter-notes-"+topic}function load(){topic=$("topic").value;index=0;frame.src=path();$("slideList").innerHTML="";titles=[];$("notes").value="";$("status").textContent="Loading presentation…"}function collect(){try{const slides=[...frame.contentDocument.querySelectorAll(".slide")];if(!slides.length)throw Error();titles=slides.map((s,i)=>{const h=s.querySelector("h1,h2,h3");return (h?h.textContent:"Slide "+(i+1)).replace(/\s+/g," ").trim()});total=slides.length;$("slideList").innerHTML="";titles.forEach((title,i)=>{const b=document.createElement("button");b.className="slide-pick";b.textContent=String(i+1).padStart(2,"0")+" · "+title;b.onclick=()=>go(i);$("slideList").append(b)});$("status").textContent=total+" slides loaded. Presenter controls ready.";go(0)}catch(e){$("status").textContent="Could not load slides. Make sure both pages are hosted on the same website."}}function send(){const msg={type:"three-seeds-science-go-to-slide",index};try{frame.contentWindow.postMessage(msg,location.origin)}catch(e){}if(opened&&!opened.closed)try{opened.postMessage(msg,location.origin)}catch(e){}}function render(){if(!total)return;$("back").disabled=index===0;$("forward").textContent=index===total-1?"Restart slides":"Next slide";$("nextNumber").textContent=index===total-1?"COMPLETE":"SLIDE "+String(index+2).padStart(2,"0");$("nextTitle").textContent=index===total-1?"Presentation complete":titles[index+1];$("notes").value=localStorage.getItem(key()+"-"+index)||"";document.querySelectorAll(".slide-pick").forEach((b,i)=>b.classList.toggle("active",i===index));send()}function go(i){if(!total)return;index=Math.max(0,Math.min(total-1,i));render()}frame.addEventListener("load",()=>setTimeout(collect,200));$("topic").addEventListener("change",load);$("back").onclick=()=>go(index-1);$("forward").onclick=()=>go(index===total-1?0:index+1);$("launch").onclick=()=>{opened=window.open(path(),"threeSeedsScienceAudience");if(!opened)$("status").textContent="Pop-up blocked. Allow pop-ups to open the audience display.";else{opened.focus();send();$("status").textContent="Audience display opened. Control it from this presenter window."}};$("fullscreen").onclick=async()=>{try{await frame.requestFullscreen()}catch(e){$("status").textContent="Fullscreen preview is unavailable in this browser."}};$("notes").oninput=e=>localStorage.setItem(key()+"-"+index,e.target.value);document.addEventListener("keydown",e=>{if(e.target.tagName==="TEXTAREA"||e.target.tagName==="SELECT")return;if(e.key==="ArrowRight")go(index+1);if(e.key==="ArrowLeft")go(index-1)});function draw(){ $("timer").textContent=String(Math.floor(seconds/60)).padStart(2,"0")+":"+String(seconds%60).padStart(2,"0")}$("startTimer").onclick=()=>{if(timer){clearInterval(timer);timer=null;$("startTimer").textContent="Resume"}else{$("startTimer").textContent="Pause";timer=setInterval(()=>{seconds++;draw()},1000)}};$("resetTimer").onclick=()=>{clearInterval(timer);timer=null;seconds=0;draw();$("startTimer").textContent="Start"};const wanted=new URLSearchParams(location.search).get("topic");if(wanted&&[...$("topic").options].some(o=>o.value===wanted))$("topic").value=wanted;load()})();
</script></body></html>
