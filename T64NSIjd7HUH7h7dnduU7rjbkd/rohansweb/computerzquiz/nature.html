<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f47721"><title>Nature Quiz | Quizzer</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0,0&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:"Google Sans Flex",Arial,sans-serif;color:#29231e;background:linear-gradient(135deg,#ffb24b,#f47721 48%,#d94c16);padding:22px}.wrap{max-width:850px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin:4px 0 26px}.brand{font-size:20px;font-weight:800;color:#fff;text-decoration:none}.back{color:#763a1d;text-decoration:none;font-weight:700;background:#fffC;padding:10px 14px;border-radius:12px}.panel{background:#fffefa;border-radius:26px;padding:clamp(22px,5vw,42px);box-shadow:0 22px 60px #70300e38}.eyebrow{color:#c45b22;font-size:12px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase}.title{font-size:clamp(36px,7vw,60px);line-height:1;margin:12px 0}.intro{color:#76675d;line-height:1.6}.progressrow{display:flex;justify-content:space-between;color:#806f62;font-size:13px;font-weight:700;margin:26px 0 10px}.track{height:9px;border-radius:20px;background:#f4e6d9;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,#ffad42,#e9571b);transition:width .25s}.question{font-size:clamp(21px,4vw,29px);line-height:1.3;margin:28px 0 20px;font-weight:750}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}.answer{border:2px solid #f0e5db;background:#fff;border-radius:15px;padding:16px;text-align:left;font:600 15px inherit;color:#382b22;cursor:pointer;min-height:62px;transition:.15s}.answer:hover:not(:disabled){border-color:#f47721;background:#fff7ee}.answer:disabled{cursor:default}.answer.correct{border-color:#32a66a;background:#edfff4}.answer.wrong{border-color:#e35b45;background:#fff0ed}.feedback{display:none;padding:15px;border-radius:14px;margin-top:18px;line-height:1.5}.feedback.show{display:block}.feedback.good{background:#eaf9ef;color:#17663a}.feedback.bad{background:#fff1e9;color:#8b411e}.controls{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:22px}.btn{border:0;border-radius:13px;padding:14px 20px;font:700 15px inherit;cursor:pointer}.next{background:linear-gradient(100deg,#ff9a32,#e9571b);color:white}.next:disabled{opacity:.4;cursor:not-allowed}.score{font-weight:800;color:#75452b}.result{text-align:center;display:none}.result.show{display:block}.trophy{font-size:70px}.result h2{font-size:38px;margin:8px}.result p{color:#76675d;line-height:1.6}.result .btn{margin:8px}.secondary{background:#fff0e5;color:#a54b1e}.hide{display:none!important}@media(max-width:560px){body{padding:12px}.answers{grid-template-columns:1fr}.top{margin-bottom:15px}.panel{border-radius:20px}.controls{align-items:stretch}.btn{padding:13px 15px}}
</style></head><body><div class="wrap"><header class="top"><a class="brand" href="../../../../index.html">QUIZZER</a><a class="back" href="../../../../index.html">← All resources</a></header>
<section class="panel" id="game"><div class="eyebrow">Nature & wildlife challenge</div><h1 class="title">Nature Quiz</h1><p class="intro">How much do you know about animals, plants, habitats and our amazing planet? Answer 10 questions and see your score.</p>
<div class="progressrow"><span id="counter">Question 1 of 10</span><span id="score">Score: 0</span></div><div class="track"><div class="fill" id="fill"></div></div><div class="question" id="question"></div><div class="answers" id="answers"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="controls"><span class="score" id="hint">Choose your answer</span><button class="btn next" id="next" disabled>Next question →</button></div></section>
<section class="panel result" id="result"><div class="trophy" id="trophy">🏆</div><div class="eyebrow">Quiz complete</div><h2 id="resultTitle">Amazing work!</h2><p id="resultText"></p><button class="btn next" id="again">Play again</button><a class="btn secondary" href="../../../../index.html">Back to Quizzer</a></section></div>
<script>
const questions=[
{q:"Which is the largest animal on Earth?",a:["African elephant","Blue whale","Giraffe","Great white shark"],c:1,e:"The blue whale can grow to around 30 metres long and is the largest animal known to have lived."},
{q:"What do plants absorb from the air for photosynthesis?",a:["Oxygen","Nitrogen","Carbon dioxide","Helium"],c:2,e:"Plants use carbon dioxide, water and sunlight to make their food."},
{q:"Which of these animals is a mammal that lays eggs?",a:["Platypus","Penguin","Crocodile","Frog"],c:0,e:"The platypus is a monotreme: a very unusual egg-laying mammal."},
{q:"What is the name for a place where an animal naturally lives?",a:["A climate","A habitat","A food chain","A season"],c:1,e:"A habitat provides the food, water, shelter and space an organism needs."},
{q:"Which part of a tree carries water from its roots to its leaves?",a:["Bark","Flowers","Xylem","Fruit"],c:2,e:"Xylem is made of tiny tubes that transport water and minerals upwards."},
{q:"What do bees collect from flowers to make honey?",a:["Nectar","Seeds","Tree sap","Dew"],c:0,e:"Worker bees collect sugary nectar from flowers and turn it into honey."},
{q:"Which layer of the Earth do we live on?",a:["The inner core","The outer core","The mantle","The crust"],c:3,e:"We live on Earth's thin outer rocky layer, called the crust."},
{q:"What is a group of wolves called?",a:["A flock","A pack","A herd","A colony"],c:1,e:"Wolves live and hunt together in family groups called packs."},
{q:"Which of these is a renewable energy source?",a:["Coal","Oil","Wind","Natural gas"],c:2,e:"Wind is naturally replenished and can generate electricity without burning fuel."},
{q:"Why are rainforests important to the planet?",a:["They support huge biodiversity","They make all the world's oxygen","They stop all storms","They have no impact on climate"],c:0,e:"Rainforests are home to an enormous variety of species and help regulate the global climate."}
];
let index=0,score=0,locked=false;
const $=id=>document.getElementById(id);
function render(){locked=false;const q=questions[index];$("counter").textContent="Question "+(index+1)+" of "+questions.length;$("score").textContent="Score: "+score;$("fill").style.width=(index/questions.length*100)+"%";$("question").textContent=q.q;$("answers").innerHTML="";$("feedback").className="feedback";$("feedback").textContent="";$("hint").textContent="Choose your answer";$("next").disabled=true;$("next").textContent=index===questions.length-1?"See my result →":"Next question →";q.a.forEach((answer,i)=>{const b=document.createElement("button");b.className="answer";b.textContent=String.fromCharCode(65+i)+".  "+answer;b.addEventListener("click",()=>choose(i));$("answers").appendChild(b)})}
function choose(choice){if(locked)return;locked=true;const q=questions[index],buttons=[...$("answers").children];buttons.forEach((b,i)=>{b.disabled=true;if(i===q.c)b.classList.add("correct");if(i===choice&&choice!==q.c)b.classList.add("wrong")});const right=choice===q.c;if(right)score++;$("score").textContent="Score: "+score;$("feedback").textContent=(right?"Correct! ":"Not quite. ")+q.e;$("feedback").className="feedback show "+(right?"good":"bad");$("hint").textContent=right?"Great answer!":"Keep going!";$("next").disabled=false}
function finish(){$("game").classList.add("hide");$("result").classList.add("show");$("fill").style.width="100%";const pct=score/questions.length;$("trophy").textContent=pct===1?"🏆":pct>=.7?"🌟":"🌱";$("resultTitle").textContent=pct===1?"Nature expert!":pct>=.7?"Brilliant work!":pct>=.4?"Good effort!":"Keep exploring!";$("resultText").textContent="You scored "+score+" out of "+questions.length+". "+(pct===1?"A perfect score — you really know your nature!": "Every question is a chance to learn something new. Have another go and see if you can beat your score!") }
$("next").addEventListener("click",()=>{if(!locked)return;if(index<questions.length-1){index++;render()}else finish()});$("again").addEventListener("click",()=>{index=0;score=0;$("result").classList.remove("show");$("game").classList.remove("hide");render()});render();
</script></body></html>
