<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Habitat Hero | Three Seeds</title><style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(#71cce9,#d6f1d5 65%,#34784b);font-family:Arial,sans-serif;color:#214d36;min-height:100vh;display:grid;place-items:center;overflow:hidden}.wrap{width:min(1000px,96vw);background:#fff9e9;border:4px solid #fff;border-radius:24px;box-shadow:0 20px 65px #17442c66;overflow:hidden}.top{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;gap:8px}.brand{font-weight:1000;font-size:20px}.stats{display:flex;gap:8px;flex-wrap:wrap}.pill{background:#e5f4df;padding:8px 12px;border-radius:20px;font-weight:900;font-size:13px}.game{position:relative;background:#79c8e8}.game canvas{display:block;width:100%;height:auto;aspect-ratio:16/8;touch-action:none}.overlay{position:absolute;inset:0;background:#153b2ab8;display:grid;place-items:center;padding:20px;text-align:center;color:white}.panel{max-width:470px}.panel h1{font-size:clamp(35px,7vw,64px);margin:0 0 10px}.panel p{line-height:1.55}.btn{border:0;border-radius:14px;padding:13px 20px;background:linear-gradient(110deg,#ffd05a,#ff8b38);font-weight:1000;color:#4c3215;cursor:pointer;font-size:15px}.controls{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:#f6f3dd}.hint{font-size:12px;color:#6d826c}.touch{display:flex;gap:9px}.touch button{width:55px;height:45px;border:0;border-radius:13px;background:#e4f1dd;font-size:23px;font-weight:bold;color:#315f3d;touch-action:none}@media(min-width:750px){.touch{opacity:.6}}@media(max-width:600px){.wrap{width:100vw;border-radius:0}.game canvas{aspect-ratio:4/3}.top{padding:10px}.brand{font-size:16px}.hint{max-width:45%;line-height:1.3}}
</style></head><body><div class="wrap"><header class="top"><div class="brand">🌿 HABITAT HERO</div><div class="stats"><span class="pill" id="seeds">🌰 0 / 12</span><span class="pill" id="lives">❤️ 3</span><span class="pill" id="level">WORLD 1</span></div></header><div class="game"><canvas id="game" width="960" height="480"></canvas><div class="overlay" id="overlay"><div class="panel"><h1>Habitat Hero!</h1><p>Run through the woodland, leap over fallen logs and collect 12 golden seeds. Watch out for muddy puddles and help restore the forest!</p><p><b>Move:</b> A / D or ← → &nbsp; <b>Jump:</b> Space / ↑</p><button class="btn" id="start">START ADVENTURE</button></div></div></div><div class="controls"><span class="hint">Keyboard: ← → move · Space jump · P pause</span><div class="touch"><button id="left">◀</button><button id="jump">⬆</button><button id="right">▶</button></div></div></div>
<script>
const c=document.getElementById("game"),ctx=c.getContext("2d"),W=960,H=480;let running=false,paused=false,frame=0,world=0,score=0,lives=3,cam=0,keys={},player,items=[],hazards=[],particles=[];
const $=id=>document.getElementById(id);
function makeWorld(){player={x:90,y:300,vx:0,vy:0,w:38,h:48,on:false,inv:0};items=[];hazards=[];for(let n=0;n<12;n++)items.push({x:350+n*235+Math.random()*70,y:245-Math.random()*80,taken:false,phase:Math.random()*6});for(let n=0;n<15;n++)hazards.push({x:570+n*185,y:385,w:45+Math.random()*24,h:28,kind:n%3})}
function start(){score=0;lives=3;world=0;frame=0;cam=0;makeWorld();running=true;paused=false;$("overlay").style.display="none";updateHud();requestAnimationFrame(loop)}
function updateHud(){$("seeds").textContent="🌰 "+score+" / 12";$("lives").textContent="❤️ "+lives;$("level").textContent="WORLD "+(world+1)}
function hit(){if(player.inv>0)return;lives--;player.inv=100;player.vy=-5;if(lives<=0){finish(false)}updateHud()}
function finish(win){running=false;$("overlay").style.display="grid";$("overlay").innerHTML='<div class="panel"><h1>'+(win?'Forest restored! 🌳':'Oh no! Try again!')+'</h1><p>You collected <b>'+score+' of 12 seeds</b>. '+(win?'The woodland is growing again. You are a true Habitat Hero!':'The woodland still needs your help. Have another go!')+'</p><button class="btn" id="restart">PLAY AGAIN</button> <button class="btn" onclick="location.href=\'../index.html\'">HOME</button></div>';$("restart").onclick=start}
function loop(){if(!running)return;if(!paused)step();draw();requestAnimationFrame(loop)}
function step(){frame++;let left=keys.ArrowLeft||keys.a||keys.left,right=keys.ArrowRight||keys.d||keys.right;if(left)player.vx-=.65;if(right)player.vx+=.65;player.vx*=.82;player.vx=Math.max(-5,Math.min(5,player.vx));if((keys[" "]||keys.ArrowUp||keys.jump)&&player.on){player.vy=-12;player.on=false}player.vy+=.58;player.x+=player.vx;player.y+=player.vy;if(player.y+player.h>=390){player.y=390-player.h;player.vy=0;player.on=true}if(player.x<0)player.x=0;cam=Math.max(0,player.x-260);if(player.inv>0)player.inv--;
for(const it of items){if(!it.taken&&Math.hypot(player.x+18-(it.x-cam),player.y+20-it.y)<34){it.taken=true;score++;updateHud();for(let j=0;j<8;j++)particles.push({x:it.x-cam,y:it.y,vx:Math.random()*4-2,vy:-Math.random()*4,life:30})}}
for(const h of hazards){let hx=h.x-cam;if(hx>-50&&hx<W+50&&player.x+cam+player.w>h.x&&player.x+cam<h.x+h.w&&player.y+player.h>390-h.h)hit()}
particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.15;p.life--});particles=particles.filter(p=>p.life>0);if(score>=12)finish(true);if(player.y>H)hit()}
function draw(){let g=ctx;g.clearRect(0,0,W,H);let sky=g.createLinearGradient(0,0,0,H);sky.addColorStop(0,"#78cbed");sky.addColorStop(.65,"#d9f0c7");sky.addColorStop(1,"#7dbb62");g.fillStyle=sky;g.fillRect(0,0,W,H);
g.fillStyle="#fff7a8";g.beginPath();g.arc(790,75,42,0,7);g.fill();for(let n=0;n<9;n++){let x=((n*180-cam*.22)%1200+1200)%1200-100;g.fillStyle=n%2?"#7ebd76":"#5da76b";g.beginPath();g.ellipse(x,310,180,80,0,0,7);g.fill()}
g.fillStyle="#468e52";g.fillRect(0,390,W,90);g.fillStyle="#2d7145";g.fillRect(0,420,W,60);for(let n=0;n<80;n++){let x=(n*37-cam*.7)%W;g.strokeStyle="#c6e68b";g.lineWidth=2;g.beginPath();g.moveTo(x,390);g.lineTo(x-5,378-(n%4)*4);g.stroke()}
for(let n=0;n<10;n++){let x=(n*190-cam*.55)%1200;if(x<0)x+=1200;g.fillStyle="#39824e";g.fillRect(x+18,260,14,130);g.fillStyle="#287449";g.beginPath();g.arc(x+25,245,45,0,7);g.fill();g.beginPath();g.arc(x,270,29,0,7);g.fill();g.beginPath();g.arc(x+53,272,30,0,7);g.fill()}
for(const h of hazards){let x=h.x-cam;if(x<-60||x>W+60)continue;if(h.kind===0){g.fillStyle="#80563a";g.beginPath();g.roundRect(x,390-h.h,h.w,h.h,12);g.fill();g.fillStyle="#b98251";g.fillRect(x+8,390-h.h+6,h.w-16,6)}else if(h.kind===1){g.fillStyle="#567d9a";g.beginPath();g.ellipse(x+22,389,h.w/2,10,0,0,7);g.fill();g.fillStyle="#a6d6e7";g.beginPath();g.ellipse(x+22,388,h.w/3,5,0,0,7);g.fill()}else{g.fillStyle="#59482c";g.beginPath();g.moveTo(x,390);g.lineTo(x+22,350);g.lineTo(x+46,390);g.fill()}}
for(const it of items)if(!it.taken){let x=it.x-cam;g.save();g.translate(x,it.y+Math.sin(frame*.08+it.phase)*5);g.fillStyle="#ffdc53";g.beginPath();g.ellipse(0,0,12,16,0,0,7);g.fill();g.fillStyle="#fff4a9";g.beginPath();g.arc(-4,-5,4,0,7);g.fill();g.restore()}
for(const p of particles){g.fillStyle="#ffe16b";g.globalAlpha=p.life/30;g.fillRect(p.x,p.y,5,5);g.globalAlpha=1}
if(!(player.inv>0&&Math.floor(frame/5)%2===0)){let x=player.x-cam;g.fillStyle="#d66b32";g.beginPath();g.roundRect(x,player.y+8,player.w,player.h-8,13);g.fill();g.fillStyle="#f2c49b";g.beginPath();g.arc(x+20,player.y+12,15,0,7);g.fill();g.fillStyle="#fff";g.beginPath();g.arc(x+25,player.y+10,5,0,7);g.fill();g.fillStyle="#263d32";g.beginPath();g.arc(x+27,player.y+10,2,0,7);g.fill();g.fillStyle="#6c3d25";g.beginPath();g.moveTo(x+6,player.y+8);g.lineTo(x+12,player.y-7);g.lineTo(x+18,player.y+8);g.fill();g.fillStyle="#f8f2db";g.fillRect(x+7,player.y+42,12,7);g.fillRect(x+23,player.y+42,12,7)}
g.fillStyle="#244f37";g.font="bold 16px Arial";g.fillText("WOODLAND TRAIL",20,30)}
document.addEventListener("keydown",e=>{keys[e.key]=true;if([" ","ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.key))e.preventDefault();if(e.key.toLowerCase()==="p"&&running)paused=!paused});document.addEventListener("keyup",e=>keys[e.key]=false);
function hold(id,k){let b=$(id);b.addEventListener("pointerdown",e=>{e.preventDefault();keys[k]=true;b.setPointerCapture(e.pointerId)});["pointerup","pointercancel","lostpointercapture"].forEach(ev=>b.addEventListener(ev,()=>keys[k]=false))}
hold("left","left");hold("right","right");hold("jump","jump");$("start").onclick=start;
</script></body></html>
