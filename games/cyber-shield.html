<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Cyber Shield | Three Seeds</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 20% 10%,#4c4c9a,#10152f 60%,#070c1d);font-family:Arial;color:#eef5ff}.wrap{width:min(960px,96vw);background:#111b38;border:1px solid #5367a0;border-radius:24px;overflow:hidden;box-shadow:0 25px 80px #0009}.top{display:flex;justify-content:space-between;align-items:center;padding:13px 18px;gap:8px}.brand{font-weight:1000;letter-spacing:1px}.stats{display:flex;gap:8px}.pill{background:#263961;padding:8px 12px;border-radius:18px;font-weight:900;font-size:13px}.game{position:relative;background:#121d3c}.game canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;touch-action:none}.overlay{position:absolute;inset:0;background:#08132ddd;display:grid;place-items:center;padding:20px;text-align:center}.panel{max-width:470px}.panel h1{font-size:clamp(35px,7vw,64px);margin:0 0 10px;color:#7ef1ee}.panel p{line-height:1.55;color:#c2cce5}.btn{border:0;border-radius:13px;padding:13px 20px;background:linear-gradient(110deg,#43d9d2,#8285ff);font-weight:1000;cursor:pointer;color:#0b1b36}.controls{padding:10px 16px;display:flex;justify-content:space-between;align-items:center}.controls small{color:#a6b4d5}.touch{display:flex;gap:8px}.touch button{border:0;border-radius:12px;background:#263961;color:white;font-size:20px;width:50px;height:42px;touch-action:none}@media(max-width:600px){.wrap{width:100vw;border-radius:0}.game canvas{aspect-ratio:4/5}.top{padding:10px}.brand{font-size:14px}.pill{font-size:11px;padding:7px}.controls small{max-width:42%;line-height:1.4}}
</style></head><body><div class="wrap"><header class="top"><div class="brand"><img src="../T64NSIjd7HUH7h7dnduU7rjbkd/rohansweb/computerzquiz/Pimages/Slide1welcone.png" alt="Three Seeds" style="width:36px;height:36px;object-fit:contain;vertical-align:middle;margin-right:8px">CYBER SHIELD</div><div class="stats"><span class="pill" id="keys">KEYS 0 / 6</span><span class="pill" id="lives">LIVES 3</span><span class="pill" id="level">LEVEL 1</span></div></header><div class="game"><canvas id="c" width="800" height="450"></canvas><div class="overlay" id="overlay"><div class="panel"><h1>Cyber Shield</h1><p>You're trapped inside the Cyber Maze! Collect all 6 security keys, dodge the roaming viruses and reach the glowing exit portal.</p><p><b>Move:</b> Arrow keys or WASD. On mobile use the buttons.</p><button class="btn" id="start">ENTER THE MAZE</button></div></div></div><div class="controls"><small>COLLECT KEYS · AVOID VIRUSES · FIND THE EXIT</small><div class="touch"><button id="up">▲</button><button id="left">◀</button><button id="down">▼</button><button id="right">▶</button></div></div></div>
<script>
const c=document.getElementById("c"),g=c.getContext("2d"),$=id=>document.getElementById(id),W=800,H=450,cols=16,rows=9,cell=50;
const maps=[
["################","#P....#.......K#","#.##..#.###.##.#","#....##...#....#","###.####..#.##.#","#K...#....#....#","#.##.#.##...##.#","#....K....K...E#","################"],
["################","#P...#....K...E#","#.#..#.##.##.#.#","#.#.....#....#.#","#.#####.#.##.#.#","#K......#....#.#","#.##.####.##.#.#","#....K......K..#","################"]
];let map,player,keys=[],bots=[],pressed={},running=false,last=0,lives=3,level=0,got=0,moveTick=0;
function build(){map=maps[level].map(r=>r.split(""));keys=[];bots=[];for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){if(map[y][x]==="P"){player={x,y};map[y][x]="."}if(map[y][x]==="K"){keys.push({x,y,taken:false});map[y][x]="."}}bots=level===0?[{x:9,y:1,dx:1,dy:0},{x:5,y:5,dx:0,dy:1},{x:12,y:6,dx:-1,dy:0}]:[{x:8,y:2,dx:0,dy:1},{x:10,y:5,dx:1,dy:0},{x:4,y:6,dx:0,dy:-1},{x:13,y:3,dx:-1,dy:0}];got=0;hud()}
function hud(){$("keys").textContent="KEYS "+got+" / "+keys.length;$("lives").textContent="LIVES "+lives;$("level").textContent="LEVEL "+(level+1)}
function start(){lives=3;level=0;build();running=true;$("overlay").style.display="none";last=0;requestAnimationFrame(loop)}
function finish(win){running=false;$("overlay").style.display="grid";$("overlay").innerHTML='<div class="panel"><h1>'+(win?'System secured!':'Connection lost!')+'</h1><p>'+(win?'You cleared both cyber mazes, gathered every key and escaped the virus network. Excellent work!':'The viruses caught you. Reset the firewall and try again!')+'</p><button class="btn" id="again">PLAY AGAIN</button> <button class="btn" onclick="location.href=\'../index.html\'">HOME</button></div>';$("again").onclick=start}
function wall(x,y){return x<0||y<0||x>=cols||y>=rows||map[y][x]==="#"}
function step(){moveTick++;let dx=0,dy=0;if(pressed.ArrowLeft||pressed.a||pressed.left)dx=-1;else if(pressed.ArrowRight||pressed.d||pressed.right)dx=1;else if(pressed.ArrowUp||pressed.w||pressed.up)dy=-1;else if(pressed.ArrowDown||pressed.s||pressed.down)dy=1;
if(dx||dy){if(moveTick%7===0&&!wall(player.x+dx,player.y+dy)){player.x+=dx;player.y+=dy;}}
for(let k of keys)if(!k.taken&&k.x===player.x&&k.y===player.y){k.taken=true;got++;hud()}
if(map[player.y][player.x]==="E"&&got===keys.length){if(level===0){level=1;build()}else finish(true)}
for(let b of bots){if(moveTick%13===0){if(wall(b.x+b.dx,b.y+b.dy)){if(Math.random()<.5){let t=b.dx;b.dx=b.dy;b.dy=-t}else{b.dx=-b.dx;b.dy=-b.dy}}else{b.x+=b.dx;b.y+=b.dy}}if(b.x===player.x&&b.y===player.y){lives--;player={x:1,y:1};hud();if(lives<=0)finish(false)}}
}
function loop(t){if(!running)return;if(t-last>90){step();last=t}draw();requestAnimationFrame(loop)}
function draw(){g.fillStyle="#111a36";g.fillRect(0,0,W,H);for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){let v=map[y][x],px=x*cell,py=y*cell;if(v==="#"){g.fillStyle="#293b69";g.fillRect(px+2,py+2,46,46);g.strokeStyle="#40568c";g.strokeRect(px+5,py+5,40,40);g.fillStyle="#425b91";g.fillRect(px+8,py+8,34,4)}else{g.fillStyle="#18284b";g.fillRect(px,py,cell,cell);g.strokeStyle="#24375f";g.strokeRect(px,py,cell,cell);if(v==="E"){g.fillStyle="#2c9a9b";g.beginPath();g.arc(px+25,py+25,17+Math.sin(Date.now()/150)*3,0,7);g.fill();g.fillStyle="#a9ffed";g.beginPath();g.arc(px+25,py+25,9,0,7);g.fill()}}}
for(let k of keys)if(!k.taken){g.fillStyle="#ffd85b";g.font="30px Arial";g.fillText("◆",k.x*cell+10,k.y*cell+36)}
for(let b of bots){let x=b.x*cell+25,y=b.y*cell+25;g.fillStyle="#ff557c";g.shadowColor="#ff557c";g.shadowBlur=14;g.beginPath();g.arc(x,y,16,0,7);g.fill();g.shadowBlur=0;g.fillStyle="#fff";g.beginPath();g.arc(x-5,y-3,4,0,7);g.arc(x+6,y-3,4,0,7);g.fill();g.fillStyle="#19213d";g.beginPath();g.arc(x-5,y-3,2,0,7);g.arc(x+6,y-3,2,0,7);g.fill()}
let x=player.x*cell+25,y=player.y*cell+25;g.fillStyle="#5be2df";g.shadowColor="#5be2df";g.shadowBlur=18;g.beginPath();g.arc(x,y,17,0,7);g.fill();g.shadowBlur=0;g.fillStyle="#152747";g.fillRect(x-8,y-5,5,5);g.fillRect(x+4,y-5,5,5);g.fillStyle="#fff";g.fillRect(x-5,y+5,10,3)}
document.addEventListener("keydown",e=>{pressed[e.key]=true;if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key))e.preventDefault()});document.addEventListener("keyup",e=>pressed[e.key]=false);
function hold(id,k){let b=$(id);b.addEventListener("pointerdown",e=>{e.preventDefault();pressed[k]=true;b.setPointerCapture(e.pointerId)});["pointerup","pointercancel","lostpointercapture"].forEach(ev=>b.addEventListener(ev,()=>pressed[k]=false))}
hold("up","up");hold("down","down");hold("left","left");hold("right","right");$("start").onclick=start;draw();
</script></body></html>
