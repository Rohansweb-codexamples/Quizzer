<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#151a2b"><title>Space | Presenter</title>
<style>
:root{color-scheme:dark;--bg:#151a2b;--panel:#20283d;--line:#ffffff20;--gold:#ffd36e;--red:#ed4054;--muted:#b8c0d2}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 12% 0%,#573044 0,transparent 34%),var(--bg);color:#fff;font:15px/1.45 Arial,sans-serif}.top{height:66px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;background:#0d1220dd;border-bottom:1px solid var(--line)}.brand{font-size:12px;font-weight:900;letter-spacing:2px;color:var(--gold)}a,.btn{border:0;border-radius:9px;padding:11px 15px;background:var(--gold);color:#171b2c;text-decoration:none;font-weight:900;cursor:pointer}.layout{max-width:1500px;margin:auto;padding:18px;display:grid;grid-template-columns:minmax(0,1.6fr) minmax(290px,.7fr);gap:16px}.panel{background:#20283ddd;border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 16px 45px #0002}.label{font-size:10px;letter-spacing:2px;font-weight:900;color:#ff9ba5}.screen{aspect-ratio:16/9;background:#090d17;border-radius:11px;overflow:hidden;margin-top:12px}.screen iframe{width:100%;height:100%;border:0}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}.actions button,.jump button{border:1px solid var(--line);border-radius:9px;padding:11px 14px;background:#ffffff12;color:#fff;font-weight:800;cursor:pointer}.actions .primary{background:var(--red);border-color:var(--red)}button:disabled{opacity:.35;cursor:not-allowed}.jump{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-top:12px;max-height:240px;overflow:auto}.jump button{text-align:left;font-size:11px}.jump button.active{background:var(--gold);color:#171b2c;border-color:var(--gold)}.upnext{margin-top:12px;padding:20px;border-radius:13px;background:linear-gradient(125deg,#ed4054,#63243c);min-height:130px}.upnext small{letter-spacing:2px;font-size:10px}.upnext h2{margin:10px 0 0;font-size:24px}.notes{width:100%;min-height:130px;margin-top:12px;border-radius:9px;padding:11px;background:#101522;color:#fff;border:1px solid var(--line);font:14px/1.5 Arial}.muted,.status{font-size:12px;color:var(--muted);margin-top:9px}.timer{font-size:38px;font-weight:900;margin-top:12px;font-variant-numeric:tabular-nums}@media(max-width:850px){.layout{grid-template-columns:1fr;padding:10px}.jump{grid-template-columns:repeat(2,1fr)}.screen{aspect-ratio:4/3}.top{padding:0 12px}}
</style></head><body>
<header class="top"><span class="brand">THREE SEEDS / SPACE / PRESENTER</span><div class="actions" style="margin:0"><a href="index.html">Topic home</a><button class="btn" id="openAudience">Open audience display ↗</button></div></header>
<main class="layout"><section class="panel"><div class="label">LIVE AUDIENCE PREVIEW</div><div class="screen"><iframe id="audience" src="presentation.html" title="Audience presentation" allow="fullscreen"></iframe></div><div class="actions"><button id="previous">← Previous</button><button class="primary" id="next">Next slide →</button><button id="fullscreen">Fullscreen preview</button></div><div class="label" style="margin-top:22px">GO TO SLIDE</div><div class="jump" id="jump"></div></section>
<aside><section class="panel"><div class="label">UP NEXT</div><div class="upnext"><small id="slideNo">SLIDE 01</small><h2 id="slideTitle">Loading presentation…</h2></div><div class="label" style="display:block;margin-top:18px">PRESENTER NOTES</div><textarea id="notes" class="notes" placeholder="Private notes for this slide"></textarea><div class="muted">Notes stay on this device and are never shown to the audience.</div></section><section class="panel" style="margin-top:14px"><div class="label">PRESENTATION TIMER</div><div class="timer" id="clock">00:00</div><div class="actions"><button id="timerToggle">Start</button><button id="timerReset">Reset</button></div><div class="status" id="connection">Connecting to Space audience display…</div></section></aside></main>
<script>
(()=>{const $=id=>document.getElementById(id),frame=$("audience"),KEY="three-seeds-space-state",CHANNEL="three-seeds-space",NOTE="three-seeds-space-notes-",titles=["Our Solar System","What is the Solar System?","Meet the Sun","A family of planets","This is Earth","The Moon","Moon phases","Earth is always moving","Explore and observe","Mission complete"];let current=0,popup=null,elapsed=0,tick=null;const bc=("BroadcastChannel"in window)?new BroadcastChannel(CHANNEL):null;
function paint(){ $("previous").disabled=current===0;$("next").textContent=current===titles.length-1?"Restart ↺":"Next slide →";$("slideNo").textContent="SLIDE "+String(current+1).padStart(2,"0")+" / "+String(titles.length).padStart(2,"0");$("slideTitle").textContent=titles[current];$("notes").value=localStorage.getItem(NOTE+current)||"";[...$("jump").children].forEach((el,i)=>el.classList.toggle("active",i===current))}
function send(index){const packet={type:"presenter-set-slide",index,source:"presenter",at:Date.now()};try{localStorage.setItem(KEY,JSON.stringify(packet))}catch(e){}try{if(bc)bc.postMessage(packet)}catch(e){}try{frame.contentWindow.postMessage(packet,"*")}catch(e){}if(popup&&!popup.closed){try{popup.postMessage(packet,"*");if(typeof popup.threeSeedsSetSlide==="function")popup.threeSeedsSetSlide(index)}catch(e){}}}
function go(n){current=Math.max(0,Math.min(titles.length-1,Number(n)||0));paint();send(current)}
function receive(data){if(!data||data.type!=="audience-slide-changed"||!Number.isInteger(data.index))return;current=Math.max(0,Math.min(titles.length-1,data.index));paint()}
titles.forEach((title,i)=>{const b=document.createElement("button");b.textContent=String(i+1).padStart(2,"0")+" · "+title;b.addEventListener("click",()=>go(i));$("jump").append(b)});
window.addEventListener("message",e=>receive(e.data));if(bc)bc.addEventListener("message",e=>receive(e.data));window.addEventListener("storage",e=>{if(e.key===KEY&&e.newValue){try{receive(JSON.parse(e.newValue))}catch(err){}}});
$("previous").onclick=()=>go(current-1);$("next").onclick=()=>go(current===titles.length-1?0:current+1);
$("openAudience").onclick=()=>{popup=window.open("presentation.html","threeSeedsSpaceAudience");if(!popup){$("connection").textContent="Pop-up blocked. Allow pop-ups for this site.";return}popup.focus();setTimeout(()=>send(current),500)};
$("fullscreen").onclick=async()=>{try{await (frame.contentDocument.getElementById("deck")||frame).requestFullscreen()}catch(e){$("connection").textContent="Use the audience display's Fullscreen button."}};
$("notes").addEventListener("input",()=>localStorage.setItem(NOTE+current,$("notes").value));
document.addEventListener("keydown",e=>{if(e.target===$("notes"))return;if(e.key==="ArrowRight"||e.key==="PageDown")go(current+1);if(e.key==="ArrowLeft"||e.key==="PageUp")go(current-1)});
function draw(){$("clock").textContent=String(Math.floor(elapsed/60)).padStart(2,"0")+":"+String(elapsed%60).padStart(2,"0")}
$("timerToggle").onclick=()=>{if(tick){clearInterval(tick);tick=null;$("timerToggle").textContent="Resume"}else{$("timerToggle").textContent="Pause";tick=setInterval(()=>{elapsed++;draw()},1000)}};
$("timerReset").onclick=()=>{clearInterval(tick);tick=null;elapsed=0;draw();$("timerToggle").textContent="Start"};
$("connection").textContent="10 slides ready · two-way sync enabled";paint();try{const saved=JSON.parse(localStorage.getItem(KEY));if(Number.isInteger(saved.index))current=Math.max(0,Math.min(9,saved.index))}catch(e){}paint();frame.addEventListener("load",()=>send(current));setTimeout(()=>send(current),900);
})();
</script></body></html>
