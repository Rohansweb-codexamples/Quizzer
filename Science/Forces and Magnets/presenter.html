<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forces &amp; Magnets Presenter | Three Seeds</title><style>*{box-sizing:border-box}body{margin:0;background:#171b2c;color:#fff;font-family:Arial,sans-serif}.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 20px;background:#101522;border-bottom:1px solid #ffffff25}.brand{font-size:12px;letter-spacing:2px;font-weight:900;color:#ff9ba5}.bar a,.bar button{border:0;border-radius:9px;padding:11px 15px;background:#ffd36e;color:#171b2c;text-decoration:none;font-weight:900;cursor:pointer}.layout{max-width:1500px;margin:auto;padding:18px;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(270px,.7fr);gap:16px}.panel{background:#ffffff0c;border:1px solid #ffffff25;border-radius:15px;padding:15px}.label{font-size:10px;letter-spacing:2px;font-weight:900;color:#ff9ba5}.screen{aspect-ratio:16/9;background:#101522;border-radius:10px;overflow:hidden;margin-top:12px}.screen iframe{width:100%;height:100%;border:0}.row{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}.row button{border:1px solid #ffffff30;border-radius:9px;padding:11px 14px;background:#ffffff16;color:#fff;font-weight:800;cursor:pointer}.row button.primary{background:#ed4054;border-color:#ed4054}.row button:disabled{opacity:.3}.list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;max-height:210px;overflow:auto;margin-top:12px}.pick{background:#ffffff12;border:1px solid #ffffff25;border-radius:8px;color:white;padding:9px;text-align:left;font-size:11px;cursor:pointer}.pick.active{background:#ffd36e;color:#171b2c;border-color:#ffd36e}.notes{width:100%;min-height:130px;margin-top:12px;border-radius:9px;padding:11px;background:#101522;color:#fff;border:1px solid #ffffff30;font:14px/1.5 Arial}.upnext{margin-top:12px;border-radius:12px;padding:18px;background:linear-gradient(120deg,#ed4054,#63243c)}.upnext small{font-size:10px;letter-spacing:2px}.upnext h2{font-size:22px;margin:10px 0 0}.timer{font-size:38px;font-weight:900;margin-top:10px}.status{font-size:12px;color:#c6cad6;margin-top:10px;line-height:1.5}@media(max-width:850px){.layout{grid-template-columns:1fr;padding:10px}.list{grid-template-columns:repeat(2,1fr)}.screen{aspect-ratio:4/3}}</style></head><body><header class="bar"><span class="brand">THREE SEEDS · FORCES &amp; MAGNETS · PRESENTER VIEW</span><div class="row" style="margin:0"><a href="index.html">Topic home</a><button id="open">Open audience display ↗</button></div></header><main class="layout"><section class="panel"><div class="label">AUDIENCE DISPLAY PREVIEW</div><div class="screen"><iframe id="frame" allowfullscreen="true" src="presentation.html" title="Forces and Magnets audience display"></iframe></div><div class="row"><button id="prev">← Previous</button><button class="primary" id="next">Next slide →</button><button id="full">Fullscreen preview</button></div><div class="label" style="margin-top:20px">JUMP TO SLIDE</div><div class="list" id="list"></div></section><aside><section class="panel"><div class="label">UP NEXT</div><div class="upnext"><small id="number">SLIDE 02</small><h2 id="title">Loading slides…</h2></div><div class="label" style="display:block;margin-top:18px">PRIVATE PRESENTER NOTES</div><textarea id="notes" class="notes" placeholder="Your notes for this slide. Only visible in this presenter window."></textarea><div class="status">Notes are saved on this device and are not shown on the audience display.</div></section><section class="panel" style="margin-top:14px"><div class="label">PRESENTATION TIMER</div><div class="timer" id="timer">00:00</div><div class="row"><button id="start">Start</button><button id="reset">Reset</button></div><div class="status" id="status">Connecting to presentation…</div></section></aside></main><script>(()=>{const $=id=>document.getElementById(id),frame=$("frame");let slides=[],titles=[],index=0,seconds=0,timer=null,popup=null;const noteKey="three-seeds-forces-magnets-notes-";function send(){const msg={type:"three-seeds-science-go-to-slide",index,stamp:Date.now()};try{if(frame.contentWindow.threeSeedsGoToSlide)frame.contentWindow.threeSeedsGoToSlide(index);frame.contentWindow.postMessage(msg,"*")}catch(e){}try{localStorage.setItem("three-seeds-forces-magnets-slide",JSON.stringify(msg))}catch(e){}try{if("BroadcastChannel"in window){const channel=new BroadcastChannel("three-seeds-forces-magnets");channel.postMessage(msg);channel.close()}}catch(e){}if(popup&&!popup.closed){try{if(popup.threeSeedsGoToSlide)popup.threeSeedsGoToSlide(index);popup.postMessage(msg,"*")}catch(e){}}}function render(){if(!slides.length)return;$("prev").disabled=index===0;$("next").textContent=index===slides.length-1?"Restart ↺":"Next slide →";$("number").textContent=index===slides.length-1?"LAST SLIDE":"SLIDE "+String(index+2).padStart(2,"0");$("title").textContent=titles[index+1]||"Presentation complete";$("notes").value=localStorage.getItem(noteKey+index)||"";[...$("list").children].forEach((b,i)=>b.classList.toggle("active",i===index));send()}function go(n){if(!slides.length)return;index=Math.max(0,Math.min(slides.length-1,n));render()}function collect(){try{slides=[...frame.contentDocument.querySelectorAll(".slide")];if(!slides.length){$("status").textContent="Waiting for slideshow…";setTimeout(collect,300);return;}titles=slides.map((s,i)=>{const h=s.querySelector("h1,h2,h3");return(h?h.textContent:"Slide "+(i+1)).replace(/\s+/g," ").trim()});$("list").innerHTML="";titles.forEach((t,i)=>{const b=document.createElement("button");b.className="pick";b.textContent=String(i+1).padStart(2,"0")+" · "+t;b.onclick=()=>go(i);$("list").append(b)});$("status").textContent=slides.length+" slides ready. Use the controls or arrow keys.";go(0)}catch(e){$("status").textContent="Could not read slides. Refresh this page after the presentation has loaded."}}frame.addEventListener("load",()=>setTimeout(collect,250));setTimeout(collect,500);$("prev").onclick=()=>go(index-1);$("next").onclick=()=>go(index===slides.length-1?0:index+1);$("open").onclick=()=>{popup=window.open("presentation.html","threeSeedsForcesMagnetsAudience");if(!popup)$("status").textContent="Allow pop-ups to open the audience display.";else{popup.focus();send()}};$("full").onclick=async()=>{try{const target=frame.contentDocument&&frame.contentDocument.getElementById("deck");if(target&&target.requestFullscreen)await target.requestFullscreen();else await frame.requestFullscreen()}catch(e){$("status").textContent="Fullscreen was blocked. Try opening the audience display, then use its Fullscreen button."}};$("notes").oninput=()=>localStorage.setItem(noteKey+index,$("notes").value);document.addEventListener("keydown",e=>{if(e.target.tagName==="TEXTAREA")return;if(e.key==="ArrowRight")go(index+1);if(e.key==="ArrowLeft")go(index-1)});function draw(){$("timer").textContent=String(Math.floor(seconds/60)).padStart(2,"0")+":"+String(seconds%60).padStart(2,"0")}$("start").onclick=()=>{if(timer){clearInterval(timer);timer=null;$("start").textContent="Resume"}else{$("start").textContent="Pause";timer=setInterval(()=>{seconds++;draw()},1000)}};$("reset").onclick=()=>{clearInterval(timer);timer=null;seconds=0;draw();$("start").textContent="Start"}})();</script></body></html>
