<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#c92332"><title>Forces &amp; Magnets Quiz | Three Seeds</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#291a32,#111827 70%,#521e2a);font-family:Arial,sans-serif;color:#fff;padding:24px}.wrap{max-width:850px;margin:0 auto}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.brand,.tag{font-size:11px;font-weight:900;letter-spacing:2px;color:#ff9ba5}.top a{color:#ffd0d5;text-decoration:none;font-weight:800}.card{margin-top:28px;padding:clamp(20px,5vw,42px);background:#ffffff12;border:1px solid #ffffff30;border-radius:22px}.tag{margin-bottom:14px}h1{font-size:clamp(34px,7vw,62px);line-height:1;margin:10px 0 18px}.question{font-size:clamp(21px,3vw,29px);line-height:1.3;margin:26px 0 20px}.answers{display:grid;gap:11px}.answers button,.action{padding:15px 17px;border-radius:12px;border:1px solid #ffffff45;background:#ffffff12;color:#fff;text-align:left;font-size:16px;font-weight:700;cursor:pointer}.answers button:hover:not(:disabled){background:#ffffff25}.answers button.correct{background:#176b4b;border-color:#64d6a5}.answers button.wrong{background:#842b3a;border-color:#ff9ba5}.feedback{min-height:48px;margin-top:18px;line-height:1.5;color:#f5dce2}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:20px}.action{background:#c92332;text-align:center}.action:disabled{opacity:.35;cursor:default}.progress{height:6px;background:#ffffff25;border-radius:9px;overflow:hidden;margin-top:22px}.progress span{display:block;height:100%;width:0;background:#ff9ba5}.score{font-size:clamp(42px,8vw,70px);font-weight:900;color:#ffbd84}@media(max-width:520px){body{padding:14px}.card{margin-top:18px}.actions button{padding:13px}}
</style></head><body><main class="wrap"><header class="top"><span class="brand">THREE SEEDS · SCIENCE</span><a href="index.html">Forces &amp; Magnets home</a></header><section class="card"><div class="tag">KNOWLEDGE CHECK</div><h1>Forces <span style="color:#ffbd84">&amp; Magnets</span></h1><div id="area"><p>Ten questions to test what you have learned about forces, gravity and magnets.</p><button class="action" id="start">Start quiz</button></div><div class="progress"><span id="bar"></span></div></section></main><script>
(()=>{const qs=[
["What is a force? ",["A push or a pull","A type of light","A kind of material","A sound"],0,"A force is a push or a pull."],
["What unit is used to measure force?",["Watt","Newton","Joule","Volt"],1,"Force is measured in newtons (N)."],
["What happens when forces are balanced?",["The object must speed up","The object must change shape","There is no change in motion","Gravity switches off"],2,"Balanced forces do not change an object's motion."],
["Which force acts when two surfaces rub together?",["Gravity","Magnetism","Friction","Electricity"],2,"Friction acts between surfaces in contact."],
["Which force pulls objects towards Earth?",["Gravity","Friction","Air resistance","Magnetism"],0,"Earth's gravity pulls objects towards its centre."],
["Which material is attracted to a magnet?",["Plastic","Wood","Glass","Iron"],3,"Iron is a magnetic material."],
["What happens when a north pole is brought near a south pole?",["They repel","They attract","They vanish","Nothing can happen"],1,"Opposite magnetic poles attract."],
["What happens when two north poles are brought close together?",["They attract","They repel","They become south poles","They melt"],1,"Like magnetic poles repel."],
["What is the region around a magnet where magnetic forces act called?",["A sound wave","A magnetic field","A friction zone","A gravity hole"],1,"A magnetic field surrounds a magnet."],
["Which tool uses a small magnet to show direction?",["Thermometer","Ruler","Compass","Stopwatch"],2,"A compass needle aligns with Earth's magnetic field."]
];let q=0,score=0,locked=false;const area=document.getElementById("area"),bar=document.getElementById("bar");function start(){q=0;score=0;render()}function render(){locked=false;const item=qs[q];area.innerHTML='<div class="tag">QUESTION '+(q+1)+' OF '+qs.length+'</div><div class="question">'+item[0]+'</div><div class="answers">'+item[1].map((a,i)=>'<button data-answer="'+i+'">'+String.fromCharCode(65+i)+'. '+a+'</button>').join("")+'</div><div class="feedback" id="feedback"></div><div class="actions"><span></span><button class="action" id="next" disabled>'+(q===qs.length-1?'See results':'Next question')+'</button></div>';bar.style.width=(q/qs.length*100)+'%';area.querySelectorAll('[data-answer]').forEach(b=>b.addEventListener("click",()=>answer(Number(b.dataset.answer))));document.getElementById("next").addEventListener("click",()=>{if(q<qs.length-1){q++;render()}else results()})}function answer(n){if(locked)return;locked=true;const item=qs[q];const buttons=[...area.querySelectorAll("[data-answer]")];buttons.forEach((b,i)=>{b.disabled=true;if(i===item[2])b.classList.add("correct");else if(i===n)b.classList.add("wrong")});if(n===item[2])score++;document.getElementById("feedback").textContent=(n===item[2]?"Correct. ":"Not quite. ")+item[3];document.getElementById("next").disabled=false;bar.style.width=((q+1)/qs.length*100)+'%'}function results(){bar.style.width="100%";area.innerHTML='<div class="tag">QUIZ COMPLETE</div><div class="score">'+score+' / '+qs.length+'</div><div class="question">'+(score===qs.length?'Excellent work!':score>=7?'Great effort!':'Good practice — have another go!')+'</div><p>You answered '+score+' questions correctly.</p><div class="actions"><a class="action" href="presentation.html" style="text-decoration:none">Review presentation</a><button class="action" id="again">Try again</button></div>';document.getElementById("again").addEventListener("click",start)}document.getElementById("start").addEventListener("click",start)})();
</script></body></html>
